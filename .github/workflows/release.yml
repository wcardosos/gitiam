name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node dist/index.cjs --help

      - name: Is this version already on npm?
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "@wcardosos/gitiam@$VERSION" version 2>/dev/null || true)" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already published, nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is not published yet, releasing."
          fi

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      - name: Tag and GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" \
            --title "v${{ steps.check.outputs.version }}" \
            --generate-notes
